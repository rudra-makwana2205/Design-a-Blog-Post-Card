<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- User Story 1: Main card container -->
  <div class="blog-post-card">
    
    <!-- User Story 2: Cover Image -->
    <img 
      src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" 
      alt="Scenic landscape photography cover photo" 
      class="post-img"
    >

    <!-- User Story 3: Post Content -->
    <div class="post-content">
      <h2 class="post-title">Exploring Web Design Principles</h2>
      <p class="post-excerpt">
        Learn how thoughtful contrast, clean borders, and balanced background styling can transform a standard web layout into an engaging user interface.
      </p>
      <a href="#" class="read-more">Read More</a>
    </div>

  </div>

</body>
</html>
